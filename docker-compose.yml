services:
  scan-tool-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scan-tool-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BOT_SERVER_HOST: 0.0.0.0
      BOT_SERVER_PORT: 80
    ports:
      - "8045:80"
